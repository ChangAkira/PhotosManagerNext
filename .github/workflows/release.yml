name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.13)'
        required: true
        default: 'v1.13'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Prepare release signing keystore
        run: |
          mkdir -p keystore
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/photosmanager-next-release.jks
            STORE_PASS="${{ secrets.RELEASE_STORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}"
            KEY_PASS="${{ secrets.RELEASE_KEY_PASSWORD }}"
          else
            STORE_PASS="PhotosNextRelease2026!"
            KEY_ALIAS="photosmanager-next"
            KEY_PASS="PhotosNextRelease2026!"
            keytool -genkeypair \
              -keystore keystore/photosmanager-next-release.jks \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=PhotosManagerNext, OU=Release, O=ChangAkira, L=Beijing, ST=Beijing, C=CN"
          fi
          printf 'storeFile=keystore/photosmanager-next-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK signature and prepare asset
        id: apk
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_OUT="PhotosManagerNext-${TAG}.apk"
          cp "$APK_SRC" "$APK_OUT"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK_OUT"
          ls -lh "$APK_OUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${APK_OUT}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.apk.outputs.tag }}"
          APK_OUT="${{ steps.apk.outputs.apk_path }}"
          cat > /tmp/release_notes.md <<'NOTES'
          在 PhotosManager v1.12 基础上新增「移动图片到其他相册」功能，支持直接在亮屏整理流程中将照片归类到已有相册或新建相册。

          ### 新增功能
          - **整理卡片新增「移动」操作**：底部按钮扩展为 `保留 / 移动 / 附近 / 删除`。点击「移动」在当前浮层内展开目标相册选择器，自动排除当前照片所在相册，并将最近常用的目标相册置顶；同名相册（如 `DCIM/Camera` 与 `Pictures/Camera`）会自动附带路径区分，已插旗相册保留旗标提示。
          - **支持新建目标相册**：在相册选择器右上角点击「新建相册」，可直接在悬浮窗内输入相册名称（自动校验非法字符并保存到 `Pictures/<相册名>/`）。
          - **断点续整理与回滑修改**：标记待移动的目标相册会随当前轮次持久化到 `SessionStore`，中途熄屏或进程被回收后不丢状态；回滑到已标记照片可查看「将移至：xxx」，并随时改选目标相册或改为保留/删除。
          - **批量确认与系统级移动**：本轮结束后在确认页统一展示待移动（显示 `原相册 → 目标相册`）与待删除列表，支持反选取消。执行时在 Android 10+ 优先通过 MediaStore 原地更新 `RELATIVE_PATH`（不拷贝文件字节、保留元数据，重名自动递增编号）；Android 11+ 未授予「所有文件访问」时通过 `MediaStore.createWriteRequest` 整批仅弹一次系统授权框，授予后可免弹窗直接移动；同时兼容 Android 7–9 物理文件移动与媒体库同步。

          ### 安装说明
          - 附件为已签名 Release 安装包（`versionName = 1.13`，`versionCode = 14`），下载后可直接安装。由于签名密钥与原仓库 `PhotosManager` 不同，若设备已安装原版 `PhotosManager`，请先卸载原版后再安装。
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "${TAG} 支持移动图片到其他相册" --notes-file /tmp/release_notes.md
            gh release upload "$TAG" "$APK_OUT" --clobber
          else
            gh release create "$TAG" "$APK_OUT" \
              --title "${TAG} 支持移动图片到其他相册" \
              --notes-file /tmp/release_notes.md
          fi
